<div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 mt-5">
        @if(loggedIn==false){
          <h1>Login</h1>
          <form [formGroup]="loginForm">
            <div>
              <!-- Cambié 'email' por 'username' -->
              <label for="username" style="padding:10px">Username:</label>
              <input id="username" type="text" formControlName="username" required>
              @if(loginForm.controls.username.invalid && loginForm.controls.username.touched){
                <small class="text-danger">Please enter a valid username.</small>
              }
            </div>
  
            <div>
              <label for="password" style="padding:10px">Password:</label>
              <input id="password" type="password" formControlName="password">
            </div>
  
            <button [disabled]="!loginForm.valid" type="submit" button class="btn btn-primary" (click)="login()">Login</button>
          </form>
        }@else{
          <div class="card-header">
            <h1>You are logged in</h1> 
            <p>You are logged in</p>
          </div>
          <button type="submit" button class="btn btn-primary" (click)="logout()">Logout</button>
        }
      </div>
    </div>
  </div>
